# Reviewed cargo-audit exceptions. The CI job `cargo-audit` runs from elastos/ and reads this file
# for every tracked Cargo.lock. Each entry says why it does not apply or which part is an accepted
# risk, and what removes it.
[advisories]
ignore = [
  # Reviewed 2026-11-23 against RUSTSEC-2026-0387 and all 36 tracked lockfiles:
  # https://rustsec.org/advisories/RUSTSEC-2026-0387.html
  # crypto-bigint 0.5.5 remains through elliptic-curve 0.13.8 (k256 0.13.4 and
  # p256 0.13.2) in elastos and eight provider locks: chain, custody, did, media,
  # object, protected-content-decrypt, protected-content-protect and wallet.
  # Upstream patches only >=0.7.6; every 0.7 copy is already 0.7.6. The 0.5 line
  # has no patch. Accepted risk: secret-dependent timing in arithmetic may leak
  # cryptographic secrets; the affected 0.5.5 operations are not proven constant-time.
  # Replacing this dependency line requires a separately reviewed crypto migration.
  # Remove when elliptic-curve 0.13 leaves every lock; re-review by 2026-12-23.
  "RUSTSEC-2026-0387",
  # Reviewed 2026-11-19. Upstream affects >=39.0.0,<48.0.9; >=49.0.0,<49.0.6;
  # >=50.0.0,<50.0.2; our locks use 36.0.21, below the affected lines:
  # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-2674-w29h-wqvj
  # elastos-compute also enables the `threads` Cargo feature, which supplies the
  # runtime functions required by Wasm threads; its engine sets component model and fuel only.
  # Remove when RustSec records the unaffected 36 line, or we upgrade past the affected
  # ranges. Re-review before entering an affected release line; use its patched version.
  "RUSTSEC-2026-0567",
  # Reviewed 2026-11-19. Upstream affects >=47.0.0,<=48.0.8; >=49.0.0,<=49.0.5;
  # >=50.0.0,<=50.0.1; our locks use 36.0.21, below the affected lines:
  # https://github.com/bytecodealliance/wasmtime/security/advisories/GHSA-wvgq-g5hf-6gm6
  # elastos-compute's engine sets component model and fuel only; it keeps the default
  # GC/memory movement and reservations instead of the affected immovable, unaligned heap.
  # Remove when RustSec records the unaffected 36 line, or we upgrade past the affected
  # ranges. Re-review before entering an affected release line; use its patched version.
  "RUSTSEC-2026-0573",
]
