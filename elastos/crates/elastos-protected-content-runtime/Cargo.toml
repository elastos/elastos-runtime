[package]
name = "elastos-protected-content-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal protected-content Runtime coordination state and provider seams"

[dependencies]
async-trait = "0.1"
# Plan B T4.2: the pool session wire carries base64 fields (the version srv uses).
base64 = "=0.22.1"
elastos-protected-content-provider-contracts = { path = "../elastos-protected-content-provider-contracts" }
elastos-protected-content-contracts = { path = "../elastos-protected-content-contracts" }
elastos-wallet-contract = { path = "../elastos-wallet-contract" }
# Plan B T3.2 (E10): pool session ids; exact pin at the locked version (rust-dkms rule 4).
getrandom = "=0.2.17"
hex = "0.4"
nix = { version = "0.29", features = ["fs", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
# Exact pin at the locked version (rust-dkms rule 4).
tracing = "=0.1.44"

[dev-dependencies]
elastos-auth = { path = "../elastos-auth" }
# Plan B T3.2: the shared V2 pool-release fixture (test builds only).
elastos-protected-content-contracts = { path = "../elastos-protected-content-contracts", features = ["test-fixtures"] }
ed25519-dalek = "2.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
tempfile = "3.12"
tokio = { version = "1.0", features = ["full", "test-util"] }
x-wing = { version = "=0.1.0", features = ["hazmat", "zeroize"] }
