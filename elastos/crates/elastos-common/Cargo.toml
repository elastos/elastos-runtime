[package]
name = "elastos-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Common types and utilities for ElastOS"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
# Exact pins at the locked versions (rust-dkms rule 4); rustix makes the process calls safe (ADV-04).
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Exact pin at the locked version (rust-dkms rule 4); sets errno before each libproc read.
errno = "=0.3.14"

[features]
# Fixtures for tests in other crates and workspaces; never enabled in builds.
test-fixtures = []
