[package]
name = "ipfs-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS ipfs-provider - IPFS operations via managed Kubo daemon"
license = "MIT"

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
url = "2"
tracing = "=0.1.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Safe signal and wait calls (ADV-04); exact pin at the locked version (rust-dkms rule 4).
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
tempfile = "3"
elastos-common = { path = "../../elastos/crates/elastos-common", features = ["test-fixtures"] }

[workspace]
