[package]
name = "exit-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS Browser Exit provider capsule"
license = "MIT"

[[bin]]
name = "exit-provider"
path = "src/main.rs"
required-features = ["http"]

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", optional = true }
url = "2"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
